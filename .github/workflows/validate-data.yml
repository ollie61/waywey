name: Validate hospital data

on:
  push:
    paths:
      - "hospitals/**"
      - "schemas/**"
      - "scripts/validate_hospitals.py"
      - ".github/workflows/validate-data.yml"
  pull_request:
    paths:
      - "hospitals/**"
      - "schemas/**"
      - "scripts/validate_hospitals.py"
      - ".github/workflows/validate-data.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validator
        run: python -m pip install --disable-pip-version-check "jsonschema==4.23.0"
      - name: Validate hospital packages
        run: python scripts/validate_hospitals.py
