name: Validate WayWey

on:
  push:
    paths:
      - "hospitals/**"
      - "schemas/**"
      - "scripts/validate_hospitals.py"
      - "scripts/refactor_smoke.mjs"
      - "scripts/release_candidate_check.py"
      - "scripts/audit_search_all_hospitals.mjs"
      - ".github/workflows/validate-data.yml"
      - "app.js"
      - "js/**"
      - "tests/**"
      - "index.html"
      - "styles.css"
      - "service-worker.js"
      - "manifest.webmanifest"
      - "icons/**"
      - "package.json"
      - "package-lock.json"
  pull_request:
    paths:
      - "hospitals/**"
      - "schemas/**"
      - "scripts/validate_hospitals.py"
      - "scripts/refactor_smoke.mjs"
      - "scripts/release_candidate_check.py"
      - "scripts/audit_search_all_hospitals.mjs"
      - ".github/workflows/validate-data.yml"
      - "app.js"
      - "js/**"
      - "tests/**"
      - "index.html"
      - "styles.css"
      - "service-worker.js"
      - "manifest.webmanifest"
      - "icons/**"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install browser test dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validator
        run: python -m pip install --disable-pip-version-check "jsonschema==4.23.0"
      - name: Validate hospital packages
        run: python scripts/validate_hospitals.py
      - name: Check JavaScript module syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in app.js js/*.js; do
            echo "Checking $file"
            node --input-type=module --check < "$file"
          done
          echo "Checking service-worker.js"
          node --check service-worker.js
      - name: Run modularisation smoke checks
        run: node scripts/refactor_smoke.mjs
      - name: Run regression tests
        run: node --test tests/*.test.mjs
      - name: Audit search and fuzzy matching across all hospitals
        run: node scripts/audit_search_all_hospitals.mjs
      - name: Check release-candidate invariants
        run: python scripts/release_candidate_check.py
      - name: Test browser visitor journeys
        run: npm run test:browser
