name: Validate WayWey

on:
  push:
    paths:
      - "hospitals/**"
      - "schemas/**"
      - "scripts/validate_hospitals.py"
      - ".github/workflows/validate-data.yml"
      - "app.js"
      - "js/**"
      - "index.html"
      - "service-worker.js"
  pull_request:
    paths:
      - "hospitals/**"
      - "schemas/**"
      - "scripts/validate_hospitals.py"
      - ".github/workflows/validate-data.yml"
      - "app.js"
      - "js/**"
      - "index.html"
      - "service-worker.js"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validator
        run: python -m pip install --disable-pip-version-check "jsonschema==4.23.0"
      - name: Validate hospital packages
        run: python scripts/validate_hospitals.py
      - name: Check JavaScript module syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in app.js js/*.js; do
            echo "Checking $file"
            node --input-type=module --check < "$file"
          done
